# Serves the static site and forwards /panorama/ (the data API) to the api service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /panorama/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Versioned assets (?v=hash) can be cached for a long time.
    location /static/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    location /files/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
